      - "`transform()` — encode + reindex + apply stored scaler (no re-fitting)"
      - "`reindex(columns=self._feature_cols, fill_value=0)` — handles unseen categories"
      - "fit/transform pattern mirrors sklearn's own preprocessing API"
      - "Full pipeline: encode → scale → split → train → evaluate → predict"
    narration: >
      You've built the complete supervised ML pipeline from scratch: feature
      preparation, encoding, scaling, training, and evaluation. Day 49 extends this
