day: "050"
lesson: "01"
title: "The Insight Pipeline — Combining All Section 3 Skills"
slides:
  - type: title
    heading: "The Insight Pipeline — Combining All Section 3 Skills"
    subheading: "From raw CSV to AI executive summary in one automated pipeline"
    narration: >
      Lesson 1 frames the Section 3 capstone. Days 36 through 49 gave you
      individual tools: pandas for loading, scipy for statistics, matplotlib for
      charts, sklearn for models, Ollama for narration. Day 50 assembles those
      tools into a single pipeline object — the InsightEngine — that takes any
      tabular CSV and produces a cleaned DataFrame, an EDA report, a trained
      model, an AI narrative, and a dashboard chart.

  - type: concept
    label: "pipeline design"
    heading: "The Four-Stage Pipeline"
    body: >
      The InsightEngine runs four stages in sequence, each built from earlier days:

      | Stage | Function | Days used |
      |---|---|---|
      | 1 — Load & Clean | `load_and_clean(source)` | 36, 37 |
      | 2 — EDA | `run_eda(df)` | 38, 47 |
      | 3 — Model | `train_and_evaluate(df, target)` | 48, 49 |
      | 4 — Narrate | `narrate_insights(eda, model_report)` | 40 |

      The class stores all intermediate results as attributes (`self.df`,
      `self.eda`, `self.model_report`, `self.narrative`) so that `save_chart()`
      can access them without re-running the pipeline.
    bullets:
      - "Each stage produces a clean output consumed by the next — no shared mutable state"
      - "`run(source, target_col=None)` — target_col optional; engine runs EDA even without a model"
      - "`save_chart(out_path)` — 2×2 matplotlib dashboard saved to disk (no plt.show())"
      - "Narrative via Ollama with try/except fallback — pipeline never crashes if LLM is down"
    narration: >
      The design principle is separation of concerns: each stage does one thing
      and produces a well-defined output. load_and_clean produces a clean DataFrame.
      run_eda produces a stats dict. train_and_evaluate produces a metrics dict.
      narrate_insights produces a string. save_chart produces a PNG. This makes
      the engine testable one stage at a time — which is exactly how exercises 1
      through 5 are structured.

  - type: how_it_works
    label: "Mechanism"
    heading: "InsightEngine.run() — four lines of pipeline"
    body: >
      ```python
      class InsightEngine:
          def __init__(self, title='Dataset', llm_model='llama3.2'):
              self.title     = title
              self.llm_model = llm_model
              self.df = self.eda = self.model_report = self.narrative = None

          def run(self, source, target_col=None):
              self.df           = load_and_clean(source)           # stage 1
              self.eda          = run_eda(self.df)                 # stage 2
              self.model_report = {}
              if target_col and target_col in self.df.columns:
                  self.model_report = train_and_evaluate(         # stage 3
                      self.df, target_col)
              self.narrative = narrate_insights(                   # stage 4
                  self.eda, self.model_report,
                  self.title, self.llm_model)
              return {'df': self.df, 'eda': self.eda,
                      'model_report': self.model_report,
                      'narrative': self.narrative}
      ```
    narration: >
      The run method is deliberately short. Each call delegates to a named
      function that you'll implement in exercises 1 through 4. The engine
      itself has no logic — it's an orchestrator. This is the composition
      pattern: small, testable functions wired together by a thin coordinating
      layer. The same pattern appears in professional ML pipelines, ETL jobs,
      and web application request handlers.

  - type: code
    label: "Full Pipeline Demo"
    heading: "300 rows → cleaned DataFrame → EDA → model → narrative → chart"
    code: |
      engine = InsightEngine(title='Retail Sales 2023')
      result = engine.run(make_sample_data(300), target_col='revenue')

      print(f"Rows: {engine.eda['shape']['rows']}")
      print(f"CV R²: {engine.model_report['cv_r2']['mean']:.4f}")
      print(f"Test R²: {engine.model_report['test_r2']:.4f}")
      print()
      print(engine.narrative)

      engine.save_chart('insight_report.png')
      print("Dashboard saved.")
    narration: >
      The whole pipeline — load, clean, EDA, train, evaluate, narrate, chart —
      runs in under 10 seconds on 300 rows. The output is a Python dict you can
      inspect programmatically, plus a PNG file you can share with stakeholders.
      The narrative is generated by llama3.2 locally via Ollama, so no API key
      or network connection is needed after the initial model pull.

  - type: exercise
    heading: "Exercise Overview — Build the Pipeline Stage by Stage"
    prompt: >
      The five exercises build the InsightEngine one function at a time:
      1. `load_and_clean(source) -> pd.DataFrame`
      2. `run_eda(df) -> dict`
      3. `train_and_evaluate(df, target_col) -> dict`
      4. `narrate_insights(eda, model_report, title, model) -> str`
      5. `InsightEngine` class wiring all four together

      Open exercise_01.ipynb to start with `load_and_clean`.
    hint: >
      Each exercise has all prior functions provided — you only need to implement
      the new one. The solution embedded in each exercise passes the same check
      harness the gate uses, so if all five checks pass, you're ready to move on.
    narration: >
      Start with exercise_01.ipynb. The provided cell includes all imports and
      make_sample_data. Your job is to implement load_and_clean — three logical
      steps: parse dates, fill numeric NaN with median, drop duplicates. Once all
      five checks pass there, open exercise_02.ipynb for run_eda.

  - type: summary
    heading: "Lesson 1 Takeaways"
    bullets:
      - "InsightEngine: four-stage pipeline — load/clean, EDA, model, narrate"
      - "Composition pattern: thin orchestrator calls small, tested functions"
      - "target_col is optional — engine produces EDA + narrative even without a model"
      - "Fallback narration if Ollama is unavailable — pipeline never crashes"
      - "All intermediate results stored as attributes for use by save_chart()"
    narration: >
      The InsightEngine is Section 3 in miniature: every concept from Day 36 to
      Day 49 is used exactly once, in the right order, producing something useful.
      Lessons 2 through 5 zoom in on each stage. Lesson 2 covers load_and_clean
      and run_eda, the data ingestion and exploration stages.
