day: "001"
lesson: "01"
title: "The Video Pipeline: Why We Built It"

slides:

  - type: title
    heading: "The Video Pipeline"
    subheading: "Why we built it — and what it teaches us about AI engineering"
    narration: >
      Welcome to Day 1 of 100 Days of AI. I want to start with something unconventional.
      The very first thing we're building is the tool that creates these lessons.
      The video you're watching right now was generated by the same pipeline you're
      about to understand. By the end of today you'll know how it works, why it was
      built this way, and what it tells us about how AI engineers think about problems.

  - type: concept
    label: "The Problem"
    heading: "100 Videos. By Hand?"
    body: >
      This course has 100 days of content. A traditional video requires recording,
      editing, colour grading, and rendering — easily two to four hours of production
      per lesson. Multiply that by 100 and you have 200 to 400 hours of work before
      a single student learns anything.

      This is the kind of problem AI engineers face constantly. High volume, repetitive,
      structured tasks that would be impossibly slow to do manually. The instinct isn't
      to work harder — it's to ask: can this be automated?
    narration: >
      Here's the real problem we're solving. This course has 100 days of content, and
      if I had to manually record, edit, and produce each lesson the traditional way,
      it would take two to four hours per video. That's up to 400 hours of production
      work before a single student could learn anything. And every time I needed to
      update a lesson, I'd have to do it all over again.

      This is exactly the kind of problem AI engineers encounter in the real world.
      High volume, repetitive, structured tasks. The instinct isn't to work harder —
      it's to ask: can this be automated? Can I write a system that does this for me?
      That question is at the heart of AI engineering.

  - type: concept
    label: "The Solution"
    heading: "A 3-Step Automated Pipeline"
    bullets:
      - "Step 1 — Text to Audio: Edge TTS converts the script to speech"
      - "Step 2 — Audio to Face: SadTalker animates a portrait to match the audio"
      - "Step 3 — Assembly: FFmpeg composites slides, face, and audio into a video"
    body: >
      Write a script. Run three commands. Get a video. That's the pipeline.
      No recording studio. No editing software. No manual work per lesson.
    narration: >
      The solution is a three-step automated pipeline. First, we write a script as
      plain text. Step one converts that text to natural-sounding speech using
      Microsoft's Edge TTS — a free, production-quality voice synthesis API. Step two
      takes the audio and a portrait photo and generates a talking head video using
      SadTalker, an open-source deep learning model. Step three assembles the slides,
      the talking face, and the audio into a polished final video using FFmpeg.

      The result: write a script, run three commands, get a video. No recording studio,
      no editing software, no manual work per lesson. And because it's code, every
      lesson follows the same consistent format automatically.

  - type: how_it_works
    label: "Step 1 — Edge TTS"
    heading: "Text to Speech: Edge TTS"
    body: >
      Edge TTS is Microsoft's text-to-speech engine — the same one that powers Windows
      Narrator and Microsoft Read Aloud. It supports 400+ voices across 140 languages
      and is completely free via a Python package.

      We chose Jenny, a voice designed for instructional content. As an AI engineer
      you'll use TTS in customer-facing bots, accessibility tools, language learning
      apps, and any system where you need voice without a recording studio.
    narration: >
      Let's look at each step in detail. Edge TTS is Microsoft's text-to-speech engine —
      the same technology that powers the voice in Windows, Microsoft Word's Read Aloud
      feature, and various Microsoft products. It supports over 400 voices across 140
      languages, and it's completely free to use through a Python package called edge-tts.

      We access it by passing text and a voice name to the Communicate class, and it
      returns an MP3 file. For this course we're using Jenny, a voice specifically
      designed for instructional content — clear, measured, and easy to follow.

      As an AI engineer, you'll reach for TTS APIs whenever you need to add voice to
      an application without recording audio yourself. Customer service bots,
      accessibility tools, language learning apps, automated reports — all of these
      use TTS under the hood.

  - type: how_it_works
    label: "Step 2 — SadTalker"
    heading: "Audio to Face: SadTalker"
    body: >
      SadTalker (Tencent AI Lab) solves a specific problem: given a still portrait
      and an audio track, generate a video of that person speaking in sync.

      It uses a 3D morphable face model to extract expression and head motion parameters
      from the audio waveform, then renders those onto the portrait.

      You don't need to understand the model internals to use it. This is a key
      AI engineering pattern — knowing when a model is a black box you use vs.
      a system you need to understand deeply.
    narration: >
      Step two is SadTalker, a research model from Tencent AI Lab. It solves a very
      specific problem: given a still portrait photo and an audio track, generate a
      video of that person speaking in sync with the audio.

      Under the hood, SadTalker uses a three-dimensional morphable face model to
      extract expression parameters and head motion from the audio waveform. It figures
      out when the mouth should be open, when the head should tilt, when the eyes
      should blink — and renders all of that onto your portrait frame by frame.

      Now, you don't need to fully understand that to use SadTalker effectively. And
      this is a really important AI engineering pattern to recognise. There's a
      difference between models you use as black boxes — where you understand the
      inputs, outputs, and limitations — versus systems you need to understand deeply
      because you're modifying, fine-tuning, or debugging them. SadTalker falls in the
      first category for us. We run it on Google Colab because it needs a GPU, and we
      treat it as a tool that takes audio in and gives a face video out.

  - type: how_it_works
    label: "Step 3 — FFmpeg"
    heading: "Assembly: FFmpeg"
    body: >
      FFmpeg has been around since 2000 and runs inside YouTube, Netflix, VLC, Chrome,
      Zoom, and most applications that handle video. It can convert formats, mix audio,
      composite video layers, add subtitles, and hundreds of other operations.

      We use it to composite the slide video with the talking head overlay and the
      audio track. We call it from Python using subprocess — you don't need to memorise
      FFmpeg commands, but understanding what it does and why we use it matters.
    narration: >
      The third step is FFmpeg. FFmpeg is one of the most important tools in digital
      media, and it's been around since the year 2000. Today it runs inside YouTube,
      Netflix, VLC, Chrome, Zoom, Adobe Premiere, and almost every other application
      that handles video or audio. It's open source, free, and runs on every operating
      system.

      FFmpeg can do an enormous number of things — convert between hundreds of video
      formats, mix audio tracks, composite video layers, add subtitles, resize video,
      change frame rates, and much more. For our pipeline, we use it to take three
      inputs — the slide video, the animated face, and the audio — and composite them
      into a single polished MP4 file.

      We call FFmpeg from Python using subprocess.run, so you don't need to become an
      FFmpeg expert. But understanding what it does and why we chose it — rather than,
      say, OpenCV or MoviePy — is exactly the kind of technical judgement AI engineers
      need to develop. FFmpeg is battle-tested, extraordinarily capable, and the
      industry standard for a reason.

  - type: concept
    label: "The Bigger Picture"
    heading: "What AI Engineers Actually Do"
    body: >
      AI engineering isn't only about training models. It's about connecting
      capabilities — knowing which APIs, models, and tools exist, understanding their
      trade-offs, and building systems that combine them to solve real problems.

      Today you combined three powerful tools — Edge TTS, SadTalker, FFmpeg — without
      writing a single model from scratch. You built infrastructure that can produce
      100 videos automatically. That's the skill we're building.
    bullets:
      - "Know what exists — don't reinvent tools that already work"
      - "Understand trade-offs — when to build vs. when to reuse"
      - "Think in systems — connect components into pipelines"
    narration: >
      Let's step back and look at what we actually did today, because it reveals
      something important about what AI engineering really is.

      AI engineering isn't only about training neural networks or writing machine
      learning algorithms. A huge part of the job is knowing what tools and APIs and
      models already exist, understanding their capabilities and limitations, and
      building systems that combine them intelligently to solve real problems.

      Today you combined three powerful tools — Edge TTS for voice synthesis,
      SadTalker for visual presence, FFmpeg for media assembly — without writing a
      single model from scratch. The result is infrastructure that can produce
      100 high-quality videos automatically. That's not a trivial thing.

      Three principles are at work here. First: know what exists — don't spend weeks
      building something that already works well as a free API. Second: understand
      trade-offs — know when to use a black-box model versus when you need to go
      deeper. Third: think in systems — the individual tools aren't impressive alone,
      but connected into a pipeline, they become something genuinely useful.

  - type: exercise
    heading: "Exercise 1: Generate Audio"
    prompt: >
      Open exercise_01.ipynb in 00_warmup/day_001/exercises/.

      Write the generate_audio function that takes text, a voice name, and an output
      path, and produces an MP3 file using Edge TTS. The notebook has starter code
      and automated tests that will tell you when you've got it right.

      Try writing it from memory using what you learned in this lesson.
      The Jenny voice name is: en-US-JennyNeural
    hint: "Look at the tts.py file in 00_pipeline/ — the key is edge_tts.Communicate"
    narration: >
      Now it's your turn. Open exercise one in the exercises folder for day one.
      You're going to write the generate_audio function — the core of the TTS step
      in our pipeline.

      The function takes three arguments: the text to speak, the voice name to use,
      and the output file path where the MP3 should be saved. You've already seen
      the edge_tts API in this lesson — specifically the Communicate class.

      The notebook has starter code with clear instructions and a test cell at the
      bottom that will run automatically and tell you whether your implementation
      is correct. Try to write it from memory before looking at hints. If you get
      stuck, the hint points you to the tts.py file in the pipeline folder, which
      has a working implementation.

      Take as long as you need. When all the tests pass, come back for the summary.

  - type: summary
    heading: "Key Takeaways"
    bullets:
      - "A pipeline automates repetitive, structured work — this is core AI engineering"
      - "Edge TTS converts text to natural speech — free, 400+ voices, Python API"
      - "SadTalker animates a portrait to match audio — a GPU model we use as a black box"
      - "FFmpeg composites media — industry standard, called from Python via subprocess"
      - "AI engineering = connecting existing tools intelligently, not always building from scratch"
      - "Next lesson: Edge TTS deep dive — rate, pitch, volume, and long-form text handling"
    narration: >
      Let's lock in what you've learned. A pipeline is a sequence of automated steps
      that transforms one thing into another — in our case, a text script into a
      finished video. Building pipelines for repetitive, high-volume work is one of
      the most valuable things an AI engineer can do.

      Edge TTS gives us natural-sounding voice synthesis for free, through a simple
      Python API. SadTalker animates a portrait to match audio — we use it as a black
      box, understanding its inputs and outputs without needing to understand its
      internals. And FFmpeg handles the final assembly, compositing our slides,
      face, and audio into a polished MP4.

      The deeper lesson is this: AI engineering means knowing what tools exist and how
      to connect them. You don't need to build a TTS engine or a talking head model
      from scratch to use them effectively. You need to understand what they do, when
      to use them, and how to wire them together.

      In the next lesson, we go deeper into Edge TTS. You'll learn how to control the
      rate, pitch, and volume of the voice, how to handle very long scripts that
      exceed API limits, and how to build a more robust TTS function. See you there.
