      All four pipeline functions are provided in the setup cell. Check cells use top-level await.
    hint: >
      process(): docs = [fetch_text(s) for s in self._sources].
      results = await batch_extract(docs, self.max_concurrent, self.model).
      digest  = generate_digest(results, self.model).
      ok_count = sum(1 for r in results if r.get('status') == 'ok').
      return {'source_count': len(docs), 'ok_count': ok_count, 'results': results, 'digest': digest}.
      run(): return asyncio.run(self.process()).
    narration: >
      The check harness verifies: DigestPipeline has add_source, process, run; __init__
      stores model and max_concurrent; add_source returns self and appends source; a 2-source
      process() returns a dict with all four keys; source_count==2; digest is a non-empty
      string; fluent chaining works. Two LLM calls are made during the process() check.

